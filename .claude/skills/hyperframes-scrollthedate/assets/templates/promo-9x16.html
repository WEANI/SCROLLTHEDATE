<!--
  Template Scroll The Date — PROMO MARKETING 9:16 (1080×1920) pour HyperFrames.
  Reels / TikTok / Stories. Univers attendu : scrollthedate (marketing).
  Textes incrustés : c'est une vidéo marketing, aucun rapport avec un projet client.

  À FAIRE : remplacer __…__, vérifier la safe-area (~220px haut / ~320px bas).
  Contrat : Rule of Three. Aucun Date.now()/random non seedé.
-->
<link rel="stylesheet" href="../univers/scrollthedate/tokens.css">
<style>
  html, body { margin: 0; }
  #root { position: relative; overflow: hidden;
    background: var(--brand-bg); color: var(--brand-ink); font-family: var(--brand-font-body); }
  .fill { position: absolute; inset: 0; }
  .safe { position: absolute; left: 88px; right: 88px; }
  .veil { background: linear-gradient(180deg,
      color-mix(in srgb, var(--brand-bg) 40%, transparent) 0%, transparent 45%,
      color-mix(in srgb, var(--brand-bg) 85%, transparent) 100%); }

  .headline {
    top: 1180px;                    /* bas de cadre : l'image respire au-dessus */
    font-family: var(--brand-font-display); font-weight: var(--brand-weight-display);
    font-size: 104px; line-height: 1.02; letter-spacing: -0.015em;
  }
  .headline em { font-style: italic; color: var(--brand-primary); }
  .subline { top: 1420px; font-size: 40px; line-height: 1.35; color: var(--brand-ink-soft); }
  .price {
    top: 1560px; font-family: var(--brand-font-display); font-size: 56px;
    color: var(--brand-primary);
  }
  .cta {
    bottom: 360px;                  /* AU-DESSUS de la safe-area basse (320px) */
    left: 88px; right: 88px; position: absolute;
    background: var(--brand-primary); color: var(--brand-on-primary);
    padding: 30px 44px; border-radius: 999px;
    font-family: var(--brand-font-body); font-weight: 600; font-size: 44px;
    letter-spacing: 0.06em; text-transform: uppercase; text-align: center;
    box-shadow: var(--brand-shadow);
  }
  .captions {
    bottom: 480px; left: 88px; right: 88px; position: absolute;
    text-align: center; font-size: 38px; line-height: 1.3;
    background: color-mix(in srgb, var(--brand-surface) 84%, transparent);
    color: var(--brand-ink); padding: 16px 24px; border-radius: var(--brand-radius);
  }
</style>

<div id="root" class="fill"
     data-composition-id="std-promo-9x16"
     data-width="1080" data-height="1920">

  <!-- Piste 0 : un VRAI montage en fond (jamais une maquette d'interface, cf. frame.md) -->
  <div class="clip fill" data-start="0" data-duration="18" data-track-index="0">
    <video src="../clips/__CLIP_FOND__.mp4" data-media
           style="width:100%;height:100%;object-fit:cover"></video>
  </div>
  <div class="clip fill veil" data-start="0" data-duration="18" data-track-index="1"></div>

  <!-- Piste 2 : message -->
  <div id="headline" class="clip safe headline"
       data-start="0.6" data-duration="17" data-track-index="2">__ACCROCHE__</div>
  <div id="subline" class="clip safe subline"
       data-start="1.4" data-duration="16" data-track-index="2">__SOUS_TITRE__</div>
  <div id="price" class="clip safe price"
       data-start="2.2" data-duration="15" data-track-index="2">__PRIX__ €</div>

  <!-- Piste 3 : CTA -->
  <div id="cta" class="clip cta"
       data-start="12" data-duration="6" data-track-index="3">__CTA__</div>

  <!-- Piste 4 : sous-titres FR (remplis via /hyperframes-media) -->
  <div class="clip captions"
       data-start="0" data-duration="18" data-track-index="4">__SOUS_TITRE_FR__</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  window.__timelines = window.__timelines || [];
  const tl = gsap.timeline({ paused: true });
  tl.from("#headline", { y: 36, opacity: 0, duration: 0.7, ease: "power2.out" }, 0.6)
    .from("#subline",  { y: 24, opacity: 0, duration: 0.6, ease: "power2.out" }, 1.4)
    .from("#price",    { opacity: 0, duration: 0.5, ease: "power1.out" }, 2.2)
    .from("#cta",      { y: 28, opacity: 0, duration: 0.5, ease: "power2.out" }, 12);
  window.__timelines.push(tl);
</script>
